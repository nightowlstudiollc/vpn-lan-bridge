# TCP Keepalive Configuration for Linux
#
# Installation:
# 1. Copy this file to /etc/sysctl.d/
# 2. Apply: sudo sysctl --system
#
# These values are in seconds (unlike macOS which uses milliseconds)

# Time before first keepalive probe (default: 7200 = 2 hours)
net.ipv4.tcp_keepalive_time = 30

# Interval between probes (default: 75)
net.ipv4.tcp_keepalive_intvl = 10

# Number of probes before giving up (default: 9)
net.ipv4.tcp_keepalive_probes = 6
